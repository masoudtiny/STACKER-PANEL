<style>
body{margin:0;padding:0;background:#222;overflow-x:hidden;font-family:Vazirmatn,Tahoma,Arial,sans-serif}
.panel{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;display:inline-block;transform-origin:0 0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.panel img{width:1000px;display:block}
button.z{position:absolute;padding:0;cursor:pointer;z-index:50;font-family:inherit;box-sizing:border-box;background:transparent!important;border:none!important;color:transparent!important;font-size:0!important;box-shadow:none!important;outline:none!important}
.debug-on button.z{background:rgba(255,220,0,.30)!important;border:1px solid #ffdc00!important}
.debug-on button.z.go{background:rgba(40,120,255,.35)!important;border-color:#2878ff!important}
.pick button.z{pointer-events:none}
.panel.labels-on img{filter:blur(2.5px) brightness(1.2) opacity(.2);transition:filter .15s}
.hmi-label{white-space:pre-line;position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;direction:rtl;overflow:hidden;padding:1px 3px;background:none;border:0;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000;font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-weight:700;line-height:1.2;z-index:300;pointer-events:none}
.pick .hmi-label{display:none}
#liveClock{position:absolute;z-index:40;pointer-events:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:Consolas,Menlo,monospace;font-weight:700;direction:ltr}
.panel.labels-on #liveClock{opacity:0}
#coordBox{display:none;position:fixed;top:6px;right:6px;z-index:5000;background:#000;color:#3f3;font:14px monospace;padding:6px 10px;border:1px solid #3f3;border-radius:6px;pointer-events:none;max-width:90vw;direction:ltr;white-space:pre-wrap}
#msg{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3000;background:rgba(30,37,44,.95);color:#f1f5f8;border:1px solid rgba(101,200,232,.6);border-radius:10px;padding:8px 14px;font-size:13px;max-width:90vw;direction:rtl;text-align:center}
.hmi-tooltip{position:fixed;display:none;width:220px;max-width:calc(100vw - 10px);box-sizing:border-box;padding:8px 12px;background:rgba(30,37,44,.88);color:#f1f5f8;border:1px solid rgba(101,200,232,.6);border-radius:12px;direction:rtl;text-align:right;font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 15px rgba(101,200,232,.15);z-index:2000;pointer-events:none;white-space:pre-line;backdrop-filter:blur(8px)}
.hmi-tooltip.wide{width:340px}
.hmi-tooltip-title{display:block;color:#65c8e8;font-weight:800;font-size:16px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(101,200,232,.3);direction:ltr;text-align:left;overflow-wrap:anywhere;letter-spacing:.5px}
.hmi-tooltip-text{display:block;color:#e8eef3;font-size:14px;font-weight:600;line-height:1.7;overflow-wrap:anywhere}
.hmi-tooltip-hint{display:block;margin-top:6px;color:#9fb3c0;font-size:12px}
@media (max-width:600px){.hmi-tooltip{width:165px;padding:5px 8px;font-size:11px;line-height:1.45;border-radius:9px}.hmi-tooltip.wide{width:250px}.hmi-tooltip-title{font-size:11.5px;margin-bottom:3px;padding-bottom:3px}.hmi-tooltip-text{font-size:11px;line-height:1.5}.hmi-tooltip-hint{font-size:10px}}

/* ===== عکس‌های پوشه images/layout (قسمت‌هایی که کلیک می‌کنی و به عکس دیگر می‌رود) =====
   مثال (حذف یا عوض کن):
   "belt-motor": { title: "Twist belt", image: "images/layout/TWIST BELT",
     buttons: [ [120, 80, 200, 150, "Motor", "موتور تسمه تویست", "$back"] ] },
   برای وصل‌کردن به لایوت، مقصد یکی از دکمه‌های صفحه "layout" را اسم همین صفحه ("belt-motor") بگذار. */
const EXTRA = {
};
Object.assign(PAGES, EXTRA);

const panel = document.getElementById("panel"), panelImage = document.getElementById("panelImage"), tip = document.getElementById("hmiTooltip");
const ttTitle = document.getElementById("ttTitle"), ttText = document.getElementById("ttText"), ttHint = document.getElementById("ttHint"), msg = document.getElementById("msg");
let cur = "layout", hist = [], armed = null, ptype = "mouse", p1 = null;
/* لمس: نگه داشتن انگشت (بیشتر از LONG_MS) فقط توضیح را نشان می‌دهد؛ لمس کوتاه توضیح را نشان می‌دهد و بعد از AUTO_MS وارد صفحه می‌شود */
const LONG_MS = 400, AUTO_MS = 600; let downT = 0, hideT = null, autoT = null, touching = false;

function toast(t) { msg.textContent = t; msg.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => msg.style.display = "none", 4000); }
function hideTip() { tip.style.display = "none"; }
function showTip(z, x, y, hint, rect) {
  ttTitle.textContent = z[4]; ttText.textContent = z[5]; ttHint.textContent = hint || "";
  tip.classList.toggle("wide", z[5].length > 70);
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
  let l, t;
  if (rect) {   /* لمس: توضیح بالای دکمه می‌آید تا زیر انگشت نماند */
    l = (rect.left + rect.right) / 2 - tw / 2; t = rect.top - th - 8;
    if (t < 5) t = rect.bottom + 8;
  } else {
    l = x + 14; t = y + 14;
    if (l + tw > vw - 5) l = x - tw - 14;
  }
  if (t + th > vh - 5) t = Math.max(5, vh - th - 5);
  tip.style.left = Math.max(5, Math.min(l, vw - tw - 5)) + "px"; tip.style.top = Math.max(5, t) + "px";
}
/* اسم عکس بدون پسوند نوشته می‌شود (مثل "images/MAIN MENU"). کد خودش پسوندهای png و jpg را امتحان می‌کند.
   می‌شود چند اسم جایگزین هم داد: ["images/LAYOUT", "images/LAYOTE"]. حروف بزرگ و کوچک مهم‌اند. */
const EXTS = [".png", ".jpg", ".jpeg", ".PNG", ".JPG", ".JPEG"];
function loadImage(p) {
  const bases = [].concat(p.image), list = [];
  bases.forEach(b => EXTS.forEach(e => list.push(/\.(png|jpe?g)$/i.test(b) ? b : b + e)));
  let i = 0;
  const next = () => { if (i >= list.length) { toast("عکس پیدا نشد: " + bases[0] + " (اسم فایل، پسوند و پوشه را چک کن؛ حروف بزرگ و کوچک مهم‌اند)"); return; } panelImage.src = list[i++]; };
  panelImage.onerror = next; next();
}
function render(key) {
  const p = PAGES[key]; cur = key; armed = null; clearTimeout(autoT); hideLabels(); hideTip(); p1 = null; if (clockEl) { clockEl.remove(); clockEl = null; }
  panel.querySelectorAll("button.z").forEach(b => b.remove());
  loadImage(p);
  p.buttons.forEach(z => {
    const b = document.createElement("button"); b.type = "button"; b.className = "z" + (z[6] && (z[6] === "$back" || PAGES[z[6]]) ? " go" : "");
    b.style.left = z[0] + "px"; b.style.top = z[1] + "px"; b.style.width = z[2] + "px"; b.style.height = z[3] + "px";
    b.setAttribute("aria-label", z[4] + ": " + z[5]);
    b.addEventListener("pointerdown", e => {
      ptype = e.pointerType; downT = performance.now();
      if (ptype !== "mouse") { touching = true; clearTimeout(hideT); showTip(z, 0, 0, "", b.getBoundingClientRect()); }
    });
    b.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") showTip(z, e.clientX, e.clientY); });
    b.addEventListener("pointermove", e => { if (e.pointerType === "mouse") showTip(z, e.clientX, e.clientY); });
    b.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideTip(); });
    b.addEventListener("click", e => {
      hideLabels();
      const go = z[6], ok = go === "$back" || (go && PAGES[go]);
      if (ptype === "touch" || ptype === "pen") {
        clearTimeout(autoT);
        if (performance.now() - downT >= LONG_MS) { armed = null; return; }   /* نگه داشتن = فقط توضیح */
        if (armed !== z) {
          armed = z;
          if (ok) autoT = setTimeout(() => { if (armed === z) { armed = null; navigate(go); } }, AUTO_MS);
          return;
        }
        armed = null;
      }
      if (ok) navigate(go);
    });
    panel.append(b);
  });
  fitPanel();
}
function navigate(key) {
  if (key === "$back") { if (hist.length) render(hist.pop()); return; }
  if (!PAGES[key]) return;
  hist.push(cur); if (hist.length > 50) hist.shift();
  render(key);
}

/* ===== لمس قسمت خالی: معنی همه قسمت‌های صفحه یک‌جا نشان داده می‌شود (دوباره لمس یا ۶ ثانیه = بسته شدن) ===== */
let labelsTimer = null;
function hideLabels() { clearTimeout(labelsTimer); panel.querySelectorAll(".hmi-label").forEach(e => e.remove()); panel.classList.remove("labels-on"); }
function shortText(z) {
  let t = z[5]; const i = t.indexOf(":");
  if (i > 1) {
    const pre = t.slice(0, i).trim();
    if (/^عنوان (صفحه|پنل)$/.test(pre)) t = t.slice(i + 1).trim();
    else if (pre.length <= 32) return pre;
  }
  t = t.split(/[.؛]/)[0].trim();
  if (t.length > 45) t = t.split("،")[0].trim();
  return t.length > 45 ? t.slice(0, 44) + "…" : t;
}
function addLabel(x, y, w, h, text) {
  if (!text || w < 6 || h < 6) return;
  const MINW = 64, MINH = 22;
  if (w < MINW) { x -= (MINW - w) / 2; w = MINW; }
  if (h < MINH) { y -= (MINH - h) / 2; h = MINH; }
  const d = document.createElement("div"); d.className = "hmi-label";
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; d.style.height = h + "px";
  d.textContent = text; panel.appendChild(d);
  let fs = 14; d.style.fontSize = fs + "px";
  while (fs > 10 && (d.scrollHeight > d.clientHeight + 1 || d.scrollWidth > d.clientWidth + 1)) { fs--; d.style.fontSize = fs + "px"; }
  if (d.scrollWidth > d.clientWidth + 1) { const nw = d.scrollWidth + 8; d.style.left = (x - (nw - w) / 2) + "px"; d.style.width = nw + "px"; }
  if (d.scrollHeight > d.clientHeight + 1) { const nh = d.scrollHeight + 2; d.style.top = (y - (nh - h) / 2) + "px"; d.style.height = nh + "px"; }
}
function fitLabelFont(e) {
  e.style.overflow = "hidden";
  let fs = parseFloat(e.style.fontSize) || 14;
  while (fs > 8 && (e.scrollHeight > e.clientHeight + 1 || e.scrollWidth > e.clientWidth + 1)) { fs -= 0.5; e.style.fontSize = fs + "px"; }
  if (e.scrollHeight > e.clientHeight + 1 || e.scrollWidth > e.clientWidth + 1) e.style.overflow = "visible";
}
function resolveLabelOverlaps() {
  const els = [...panel.querySelectorAll(".hmi-label")];
  if (els.length < 2) return;
  const W = panel.offsetWidth, H = panel.offsetHeight;
  const R = els.map(e => ({ e, x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }));
  const ovl = (a, b) => [Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y)];
  R.forEach(a => {   /* کادر بزرگی که چند کادر کوچک در آن است: کوچک و وسط‌چین می‌شود */
    if (a.w < 260 || a.h < 60) return;
    const inside = R.filter(b => { if (b === a) return false; const [ox, oy] = ovl(a, b); return ox > 0 && oy > 0 && ox * oy >= 0.1 * b.w * b.h && a.w * a.h > 4 * b.w * b.h; }).length;
    if (!inside) return;
    const cx = a.x + a.w / 2, cy = a.y + a.h / 2, nw = Math.min(a.w, 260);
    a.e.style.width = nw + "px"; a.e.style.height = "auto";
    a.w = a.e.offsetWidth; a.h = a.e.offsetHeight; a.x = cx - a.w / 2; a.y = cy - a.h / 2;
  });
  for (let it = 0; it < 400; it++) {
    let moved = false;
    for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) {
      const a = R[i], b = R[j], [ox, oy] = ovl(a, b);
      if (ox <= 0.5 || oy <= 0.5) continue;
      moved = true;
      if (oy <= ox) { const k = oy / 2 + 0.6, up = a.y + a.h / 2 <= b.y + b.h / 2; if (up) { a.y -= k; b.y += k; } else { a.y += k; b.y -= k; } }
      else { const k = ox / 2 + 0.6, left = a.x + a.w / 2 <= b.x + b.w / 2; if (left) { a.x -= k; b.x += k; } else { a.x += k; b.x -= k; } }
    }
    if (W && H) R.forEach(r => { r.x = Math.max(0, Math.min(r.x, W - r.w)); r.y = Math.max(0, Math.min(r.y, H - r.h)); });
    if (!moved) break;
  }
  R.forEach(r => { r.e.style.left = r.x + "px"; r.e.style.top = r.y + "px"; r.e.style.width = r.w + "px"; r.e.style.height = r.h + "px"; fitLabelFont(r.e); });
}
function showAllLabels() {
  hideLabels(); hideTip();
  (PAGES[cur].buttons).forEach(z => addLabel(z[0], z[1], z[2], z[3], shortText(z)));
  resolveLabelOverlaps();
  panel.classList.add("labels-on");
  labelsTimer = setTimeout(hideLabels, 6000);
}
panel.addEventListener("pointerup", e => {
  if (PICK || (e.pointerType === "mouse" && e.button !== 0) || e.target.closest("button.z")) return;
  if (panel.querySelector(".hmi-label")) hideLabels(); else showAllLabels();
});

/* ===== ساعت زنده: روی عکسِ ساعت می‌نشیند و هر ثانیه با ساعت واقعی به‌روز می‌شود ===== */
const CLOCKS = { "layout": [610, 90, 142, 31, 24, "time", "#fff"], "setup-time": [215, 207, 570, 52, 26, "long"] };
let clockEl = null;
const p2 = n => String(n).padStart(2, "0");
function clockText(kind) {
  const d = new Date(), yr = d.getFullYear();
  if (kind === "time") return p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  const date = p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + (kind === "long" ? yr : String(yr).slice(2));
  const time = p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  return kind === "long" ? date + "   " + d.toLocaleDateString("en-GB", { weekday: "short" }) + "   " + time : date + " " + time;
}
function sampleBg(x, y, w, h) {   /* رنگ پس‌زمینه کادر ساعت از خود عکس برداشته می‌شود */
  try {
    const k = panelImage.naturalWidth / 1000, ins = 3, c = document.createElement("canvas");
    c.width = Math.max(1, Math.round((w - 2 * ins) * k)); c.height = Math.max(1, Math.round((h - 2 * ins) * k));
    const g = c.getContext("2d"); g.drawImage(panelImage, (x + ins) * k, (y + ins) * k, (w - 2 * ins) * k, (h - 2 * ins) * k, 0, 0, c.width, c.height);
    const d = g.getImageData(0, 0, c.width, c.height).data, ch = [[], [], []];
    for (let i = 0; i < d.length; i += 4) for (let j = 0; j < 3; j++) ch[j].push(d[i + j]);

}
function placeClock() {
  if (clockEl) { clockEl.remove(); clockEl = null; }
  const c = CLOCKS[cur]; if (!c || !panelImage.naturalWidth) return;
  const rgb = sampleBg(c[0], c[1], c[2], c[3]), lum = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  clockEl = document.createElement("div"); clockEl.id = "liveClock";
  clockEl.style.cssText += "left:" + c[0] + "px;top:" + c[1] + "px;width:" + c[2] + "px;height:" + c[3] + "px;font-size:" + c[4] + "px;background:rgb(" + rgb.join(",") + ");color:" + (c[6] || (lum > 140 ? "#111" : "#fff")) + ";letter-spacing:0";
  clockEl.textContent = clockText(c[5]); panel.appendChild(clockEl);
}
setInterval(() => { if (clockEl && CLOCKS[cur]) clockEl.textContent = clockText(CLOCKS[cur][5]); }, 1000);
panelImage.addEventListener("load", placeClock);
panel.addEventListener("pointerdown", e => { if (!e.target.closest("button.z")) { armed = null; clearTimeout(autoT); hideTip(); } });
function endTouch(e) { if (e.pointerType === "mouse" || !touching) return; touching = false; clearTimeout(hideT); hideT = setTimeout(hideTip, 3000); }   /* بعد از برداشتن انگشت ۳ ثانیه می‌ماند */
document.addEventListener("pointerup", endTouch, true); document.addEventListener("pointercancel", endTouch, true);
panel.addEventListener("contextmenu", e => e.preventDefault());

function fitPanel() {
  const land = matchMedia("(orientation: landscape)").matches, sc = screen, sMax = Math.max(sc.width || 0, sc.height || 0), sMin = Math.min(sc.width || 0, sc.height || 0);
  const vw = Math.min(innerWidth, (land ? sMax : sMin) || innerWidth), vh = innerHeight, ih = panelImage.offsetHeight || 750, pad = 0;
  const s = Math.min(1, (vw - 2 * pad) / 1000, vh / ih);
  panel.style.transform = s < 1 ? "scale(" + s + ")" : "";
  panel.style.marginLeft = "0px";   /* همیشه سمت چپ صفحه */
  document.getElementById("fitWrap").style.height = s < 1 ? Math.ceil(ih * s) + "px" : "";
}
addEventListener("resize", () => { fitPanel(); hideTip(); });
addEventListener("orientationchange", () => { fitPanel(); setTimeout(fitPanel, 300); });
panelImage.addEventListener("load", fitPanel);

if (SHOW_BUTTONS) {
  panel.classList.add("debug-on"); if (PICK) panel.classList.add("pick");
  const cb = document.getElementById("coordBox"); cb.style.display = "block"; cb.textContent = "x: -  y: -";
  const xy = e => { const r = panel.getBoundingClientRect(), k = 1000 / r.width; return [Math.round((e.clientX - r.left) * k), Math.round((e.clientY - r.top) * k)]; };
  panel.addEventListener("pointermove", e => { if (!p1) { const a = xy(e); cb.textContent = "x: " + a[0] + "   y: " + a[1]; } });
  if (PICK) panel.addEventListener("click", e => {
    const a = xy(e);
    if (!p1) { p1 = a; cb.textContent = "گوشه اول: " + a[0] + ", " + a[1] + "\nحالا گوشه مقابل را کلیک کن"; return; }
    const line = "[" + Math.min(p1[0], a[0]) + ", " + Math.min(p1[1], a[1]) + ", " + Math.abs(a[0] - p1[0]) + ", " + Math.abs(a[1] - p1[1]) + ', "name", "توضیح فارسی", "page"],';
    p1 = null; cb.textContent = line + "\n(کپی شد؛ داخل buttons همین صفحه بچسبان)";

  });
}
render(PAGES[location.hash.slice(1)] ? location.hash.slice(1) : "layout");
