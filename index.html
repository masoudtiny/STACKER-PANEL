/* ===== قفل رمز (Password gate) =====
   رمز داخل فایل نیست؛ فقط هش SHA-256 آن (HASH) ذخیره شده.
   برای عوض‌کردن رمز: در کنسول مرورگر این را اجرا کن و خروجی را جای HASH بگذار:
   crypto.subtle.digest("SHA-256", new TextEncoder().encode("stacker-panel|رمزجدید با حروف کوچک")).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
*/
var SP_SALT="stacker-panel|", SP_HASH="0d9afe01e4adc63bafddaa603ad5714ed02c4e6b160729e8c714609a55718e81";
/* قفل فقط وقتی سایت از github.io باز شود فعال است؛ روی لپ‌تاپ (فایل محلی / localhost) رمز نمی‌خواهد */
var SP_NEEDS_PW=/(^|\.)github\.io$/i.test(location.hostname)||/[?&]lock\b/.test(location.search);
(function(){if(!SP_NEEDS_PW)return;try{if(!/[?&]lock\b/.test(location.search)&&sessionStorage.getItem("sp_ok2")===SP_HASH)return}catch(e){}document.documentElement.className+=" locked"})();
</script>

<script>
(function(){
function sha256js(m){function r(n,x){return(x>>>n)|(x<<(32-n))}
var K=[],H=[],i,j,p=0,c={};for(var n=2;p<64;n++){if(!c[n]){for(i=n*n;i<313;i+=n)c[i]=1;K[p]=(Math.pow(n,1/3)*4294967296)|0;H[p++]=(Math.pow(n,.5)*4294967296)|0}}
H=H.slice(0,8);var b=[],l=m.length*8;for(i=0;i<(((l+64)>>9)<<4)+16;i++)b[i]=0;for(i=0;i<m.length;i++)b[i>>2]|=m[i]<<(24-(i%4)*8);
b[l>>5]|=0x80<<(24-l%32);b[(((l+64)>>9)<<4)+15]=l;
for(i=0;i<b.length;i+=16){var w=b.slice(i,i+16),a=H.slice(0);
for(j=16;j<64;j++){var s0=r(7,w[j-15])^r(18,w[j-15])^(w[j-15]>>>3),s1=r(17,w[j-2])^r(19,w[j-2])^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)|0}
for(j=0;j<64;j++){var S1=r(6,a[4])^r(11,a[4])^r(25,a[4]),ch=(a[4]&a[5])^(~a[4]&a[6]),t1=(a[7]+S1+ch+K[j]+w[j])|0,S0=r(2,a[0])^r(13,a[0])^r(22,a[0]),mj=(a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]),t2=(S0+mj)|0;
a=[(t1+t2)|0,a[0],a[1],a[2],(a[3]+t1)|0,a[4],a[5],a[6]]}
for(j=0;j<8;j++)H[j]=(H[j]+a[j])|0}
return H.map(function(x){return("00000000"+(x>>>0).toString(16)).slice(-8)}).join("")}
function utf8(s){return Array.prototype.slice.call(unescape(encodeURIComponent(s))).map(function(c){return c.charCodeAt(0)})}
function hash(pw){var bytes=utf8(SP_SALT+pw);
if(window.crypto&&crypto.subtle&&window.TextEncoder){return crypto.subtle.digest("SHA-256",new Uint8Array(bytes)).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
return Promise.resolve(sha256js(bytes))}
var inp=document.getElementById("gatePw"),err=document.getElementById("gateErr"),busy=false;
function tryIt(){if(busy)return;busy=true;err.textContent="";
hash(inp.value.trim().toLowerCase()).then(function(h){
if(h===SP_HASH){try{sessionStorage.setItem("sp_ok2",h)}catch(e){}document.documentElement.classList.remove("locked");inp.value="";window.dispatchEvent(new Event("resize"));busy=false}
else{setTimeout(function(){err.textContent="رمز اشتباه است";inp.select();busy=false},800)}})}
document.getElementById("gateBtn").addEventListener("click",tryIt);
inp.addEventListener("keydown",function(e){if(e.key==="Enter")tryIt()});
})();
</script>

    const line = "[" + Math.min(p1[0], a[0]) + ", " + Math.min(p1[1], a[1]) + ", " + Math.abs(a[0] - p1[0]) + ", " + Math.abs(a[1] - p1[1]) + ', "name", "توضیح فارسی", "page"],';
    p1 = null; cb.textContent = line + "\n(کپی شد؛ داخل buttons همین صفحه بچسبان)";
    try { navigator.clipboard.writeText(line).catch(() => {}); } catch (er) {}
  });
}
/* نشان دادن لمس: هر جای صفحه که لمس یا کلیک شود، یک حلقه‌ی کوچک همان‌جا دیده می‌شود (جاهایی که دکمه ندارند فقط همین را نشان می‌دهند و وارد عکس دیگر نمی‌شوند) */
document.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const d = document.createElement("div"); d.className = "tap"; d.style.left = e.clientX + "px"; d.style.top = e.clientY + "px";
  document.body.appendChild(d); setTimeout(() => d.remove(), 700);
}, true);

render(PAGES[location.hash.slice(1)] ? location.hash.slice(1) : "layout");

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

(function(){
  var ib=document.getElementById("installBtn"),dp=null;
  var standalone=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone;
  if(standalone)return;
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;ib.style.display="inline-block"});
  addEventListener("appinstalled",function(){ib.style.display="none"});
  ib.addEventListener("click",function(){if(dp){dp.prompt();dp=null;ib.style.display="none"}});
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){var h=document.getElementById("iosHint");h.style.display="block";setTimeout(function(){h.style.display="none"},9000)}
})();
</script>
